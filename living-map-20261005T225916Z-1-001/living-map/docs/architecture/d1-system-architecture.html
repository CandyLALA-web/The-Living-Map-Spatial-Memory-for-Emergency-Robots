 <rect x="545" y="410" width="210" height="100" fill="#fff" stroke="#16a34a" rx="6"/>

 <text x="650" y="460" text-anchor="middle" font-size="10" fill="#334155">Starlink / Cellular LTE</text>
 <text x="650" y="480" text-anchor="middle" font-size="10" fill="#334155">TCP/IP JSON Telemetry</text>

 <rect x="810" y="80" width="260" height="35" fill="#fee2e2" rx="10"/>
 <text x="940" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">REMOTE COMMAND POST</text>

 <rect x="825" y="130" width="230" height="490" fill="#fff" stroke="#dc2626" rx="6"/>

 <text x="845" y="195" font-size="11" fill="#334155">• Ingestion Server (TCP Socket)</text>
 <text x="845" y="225" font-size="11" fill="#334155">• Spatiotemporal Event DB (SQLite)</text>
 <text x="845" y="255" font-size="11" font-weight="bold" fill="#2563eb">• Live Map (WGS-84 GIS Canvas)</text>

 <text x="860" y="420" font-size="10" fill="#64748b">- Hazard Zones &amp; Clock Sync</text>
 <text x="845" y="460" font-size="11" font-weight="bold" fill="#15803d">&larr; Pushes Mission Packet to ONA</text>
